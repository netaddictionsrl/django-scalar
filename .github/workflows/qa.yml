name: Quality Checks

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  lint:
    name: "Lint (pre-commit + ruff)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.6.17"
          python-version: "3.13"
          activate-environment: true
      - name: Install dependencies
        run: uv sync --group test --group qa
      - name: Run ruff
        run: uv run --frozen ruff check src
      - name: Run pre-commit
        run: |
          uv run --frozen pre-commit install
          uv run --frozen pre-commit run --all-files

  test:
    name: "Tests (Py ${{ matrix.python-version }} / Django ${{ matrix.django-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        django-version: ["4.2", "5.0", "5.1", "5.2"]
        exclude:
          # Django 5.0+ requires Python >=3.10; explicit drops if/when needed.
          - python-version: "3.10"
            django-version: "5.2"  # 5.2 supports 3.10 but skip a slot to keep matrix lean
    steps:
      - uses: actions/checkout@v4
      - name: Install uv (py-${{ matrix.python-version }})
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.6.17"
          python-version: ${{ matrix.python-version }}
          activate-environment: true
      - name: Install dependencies
        run: uv sync --group test
      - name: Pin Django ${{ matrix.django-version }}
        run: uv pip install "Django~=${{ matrix.django-version }}.0"
      - name: Run tests
        run: uv run --no-sync pytest
