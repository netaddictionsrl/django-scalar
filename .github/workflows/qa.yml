name: Quality Checks

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv run --locked ruff check
      - run: uv run --locked ruff format --check

  test:
    name: Tests (Py ${{ matrix.python-version }} / Django ${{ matrix.django-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        django-version: ["5.2", "6.0", "6.1"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Run tests
        run: >
          uv run --isolated --python ${{ matrix.python-version }} --with "django~=${{ matrix.django-version }}.0"
          python -Wd -m django test --settings=tests.settings
