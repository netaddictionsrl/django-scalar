[project]
name = "django-scalar"
version = "0.4.0"
description = "Publish your Django API docs with Scalar"
readme = "README.md"
license = "MIT"
authors = [{ name = "Netaddiction", email = "dev@netaddiction.it" }]
requires-python = ">=3.12"
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = ["django>=5.2"]

[project.optional-dependencies]
spectacular = ["drf-spectacular>=0.28.0", "djangorestframework>=3.15.0"]
filters = ["django-filter>=24", "drf-spectacular>=0.28.0", "djangorestframework>=3.15.0"]
all = ["django-filter>=24", "drf-spectacular>=0.28.0", "djangorestframework>=3.15.0"]

[project.urls]
Homepage = "https://github.com/netaddictionsrl/django-scalar"
Source = "https://github.com/netaddictionsrl/django-scalar"
Issues = "https://github.com/netaddictionsrl/django-scalar/issues"
Changelog = "https://github.com/netaddictionsrl/django-scalar/blob/main/CHANGELOG.md"

[dependency-groups]
# The optional integrations are installed to test them
dev = ["django-filter>=24", "drf-spectacular>=0.28.0", "djangorestframework>=3.15.0", "ruff>=0.15"]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]
