[project]
name = "django-scalar"
version = "0.3.0"
description = "Publish your Django API docs with Scalar"
readme = "README.md"
authors = [
    { name = "Netaddiction", email = "dev@netaddiction.it" },
]
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "Django >= 4.2",
]

[project.optional-dependencies]
spectacular = [
    "drf-spectacular >= 0.28.0",
    "djangorestframework >= 3.15.0",
]
filters = [
    "django-filter >= 24",
    "drf-spectacular >= 0.28.0",
    "djangorestframework >= 3.15.0",
]
all = [
    "drf-spectacular >= 0.28.0",
    "django-filter >= 24",
    "djangorestframework >= 3.15.0",
]

[project.urls]
Homepage = "https://github.com/netaddictionsrl/django-scalar"
Source = "https://github.com/netaddictionsrl/django-scalar"
Issues = "https://github.com/netaddictionsrl/django-scalar/issues"
Changelog = "https://github.com/netaddictionsrl/django-scalar/blob/main/CHANGELOG.md"

[dependency-groups]
test = [
    "mypy==1.15.0", # https://github.com/python/mypy
    "django-stubs[compatible-mypy]==5.2.0", # https://github.com/typeddjango/django-stubs
    "pytest==8.3.5",  # https://github.com/pytest-dev/pytest
    "pytest-mock==3.14.0", # https://github.com/pytest-dev/pytest-mock/
    "pytest-sugar==1.0.0", # https://github.com/Frozenball/pytest-sugar
    "djangorestframework-stubs==3.15.2", # https://github.com/typeddjango/djangorestframework-stubs
    "pytest-django==4.11.1", # https://github.com/pytest-dev/pytest-django
    "beautifulsoup4==4.12.3", # https://www.crummy.com/software/BeautifulSoup/
    "drf-spectacular >= 0.28.0",
    "django-filter >= 24",
    "djangorestframework >= 3.15.0",
]
qa = [
    "pre-commit==4.1.0", # https://github.com/pre-commit/pre-commit
    "ruff==0.11.7", # https://github.com/astral-sh/ruff
    "coverage==7.6.12", # https://github.com/nedbat/coveragepy
    "django-coverage-plugin==3.1.0", # https://github.com/nedbat/django_coverage_plugin
    "djlint==1.36.4", # https://github.com/Riverside-Healthcare/djLint
]
build = [
    "hatchling>=1.26.3",
]
all = [
    {include-group = "test"},
    {include-group = "qa"},
    {include-group = "build"},
]

[build-system]
requires = ["hatchling >= 1.26.3"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "src/django_scalar",
    "README.md",
    "CHANGELOG.md",
    "LICENSE*",
]

[tool.hatch.build.targets.wheel]
packages = ["src/django_scalar"]

[tool.pytest.ini_options]
addopts = "--ds=tests.settings"
python_files = [
    "tests.py",
    "test_*.py",
    "*_tests.py",
]

[tool.coverage.run]
include = ["src/django_scalar/**"]
omit = ["*/tests/*", "*/static/*"]
plugins = ["django_coverage_plugin"]

# ==== ruff ====
[tool.ruff]
line-length = 119
target-version = "py310"
extend-exclude = ["uv.lock", "src/django_scalar/templates/**"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "DJ",  # flake8-django
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["B", "DJ"]

# ==== mypy ====
[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
plugins = [
    "mypy_django_plugin.main",
    "mypy_drf_plugin.main",
]

[[tool.mypy.overrides]]
# Django migrations should not produce any errors:
module = "*.migrations.*"
ignore_errors = true

[tool.django-stubs]
django_settings_module = "tests.settings"

# ==== djLint ====
[tool.djlint]
use_gitignore=true
blank_line_after_tag = "load,extends"
close_void_tags = true
format_css = true
format_js = true
# TODO: remove T002 when fixed https://github.com/djlint/djLint/issues/687
ignore = "H006,H030,H031,T002"
include = "H017,H035"
indent = 2
max_line_length = 119
profile = "django"
extend_exclude = "src/django_scalar/templates/django_scalar/scalar.html"

[tool.djlint.css]
indent_size = 2

[tool.djlint.js]
indent_size = 2

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
